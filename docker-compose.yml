services:
  proxyhub:
    build: .
    image: proxyhub:1.0
    container_name: proxyhub
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 223.6.6.6
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - .:/opt/proxyhub
    ports:
      # Web UI（固定端口）
      - "8080:8080"
      # inbound 端口映射请放到 docker-compose.override.yml 中
      # 参考 docker-compose.override.example.yml
