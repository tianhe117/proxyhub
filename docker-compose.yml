services:
  proxyhub:
    build: .
    image: proxyhub:1.0
    container_name: proxyhub
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=FALSE
    volumes:
      - .:/opt/proxyhub
    ports:
      # Web UI（固定端口）
      - "8080:8080"
      # inbound 端口映射请放到 docker-compose.override.yml 中
      # 参考 docker-compose.override.example.yml
