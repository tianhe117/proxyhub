services:
  proxyhub:
    build: .
    image: proxyhub:2.0
    container_name: proxyhub
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 223.6.6.6
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - .:/opt/proxyhub
    ports:
      # Web UI (fixed port)
      - "8080:8080"
      # Add inbound port mappings in docker-compose.override.yml
      # See docker-compose.override.example.yml
