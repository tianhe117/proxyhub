services:
  proxyhub:
    build: .
    image: proxyhub:1.0
    container_name: proxyhub
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=FALSE
    volumes:
      - .:/opt/proxyhub
    ports:
      # Web UI
      - "8080:8080"
      # inbound 端口：根据你在面板中的配置添加
      # - "1080:1080"