schema_version: 1
description: ProxyHub Subscription 与分享 URI 的脱敏测试数据。HTTP 样本保留真实响应中观察到的字段结构、响应头顺序、代理组、规则类型和条目数量，仅缩减 Node 数量并替换敏感值。
security:
  contains_real_subscription_url: false
  contains_real_node_credentials: false
  live_connectivity_expected: false
cases:
- id: share-uri-ss-non-live
  kind: share_uri
  protocol: ss
  input: ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ@www.test.com:666/#test
  expected:
    parse_accepted: true
    live_connectivity: false
    purpose: 验证 Shadowsocks SIP002 分享 URI 的解析与字段回填，不执行真实连接。
- id: share-uri-vmess-non-live
  kind: share_uri
  protocol: vmess
  input: vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjE5Mi4xNjguMS4xMDAiLCJwb3J0IjoiODQ0MyIsImlkIjoiOGU2MDA0MjktZjViYS00OTVlLWIwYTYtZDhmYmM5ZWM4NzhiIiwiaG9zdCI6Ind3dy50ZXN0LmNvbSIsInBhdGgiOiIvNDljODY2LyIsIm5ldCI6IndzIiwic2VjdXJpdHkiOiJub25lIiwidGxzIjoidGxzIiwic25pIjoid3d3LnRlc3QuY29tIn0=
  expected:
    parse_accepted: true
    live_connectivity: false
    purpose: 验证 VMess Base64 JSON 分享 URI 的解析与字段回填，不执行真实连接。
- id: share-uri-vless-invalid
  kind: share_uri
  protocol: vless
  input: vless://OmY4ZjQ5MmZlLTE3ZWYtNGE0Ny1hNWNjLTA1MDEzMGVmYTY1YkBzZWxsLnlvdXlpLmJqLmNuOjQ0Mw?path=/55f3b682badf3b/&remarks=us&obfs=websocket&tls=1&udp=1
  expected:
    parse_accepted: false
    live_connectivity: false
    purpose: 验证无有效 UUID 和标准 authority 的 VLESS URI 被拒绝。
