<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProxyHub — Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-body:   #fafafa;
            --bg-card:   #fff;
            --bg-input:  #fafafa;
            --border:    #e0e0e0;
            --text:      #333;
            --text-secondary: #888;
            --accent:    #1976d2;
            --red:       #e53935;
            --font:      'Consolas', 'Monaco', 'Courier New', monospace;
            --radius:    6px;
            --tap-target: 44px;
        }
        body {
            font-family: var(--font);
            font-size: 14px;
            background: var(--bg-body);
            color: var(--text);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px 24px;
        }
        .login-card h1 {
            text-align: center;
            color: var(--accent);
            font-size: 20px;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }
        .login-card .input {
            font-family: var(--font);
            font-size: 14px;
            min-height: var(--tap-target);
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-input);
            color: var(--text);
            width: 100%;
            margin-bottom: 12px;
        }
        .login-card .input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .login-card .input::placeholder { color: var(--text-secondary); }
        .login-card .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: var(--tap-target);
            font-family: var(--font);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            margin-top: 8px;
        }
        .login-card .btn:active { opacity: 0.8; }
        .login-error {
            color: var(--red);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <form class="login-card" method="POST" action="/login">
        <h1>ProxyHub</h1>
        <input class="input" type="text" name="username" placeholder="Username" autocomplete="username" required>
        <input class="input" type="password" name="password" placeholder="Password" autocomplete="current-password">
        <button class="btn" type="submit">Login</button>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
    </form>
</body>
</html>
