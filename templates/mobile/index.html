<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ProxyHub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>
<body>
    <div class="topbar">
        <span class="brand"><span class="status-dot idle" id="sbDot"></span>ProxyHub</span>
        <button class="menu-btn" onclick="document.getElementById('menuPop').classList.toggle('show')">&#8942;</button>
    </div>
    <div class="menu-pop" id="menuPop">
        <a href="javascript:void(0)" onclick="refreshAll()">Refresh</a>
        <a href="/">Desktop</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="views">
        <!-- route 视图 -->
        <div class="view" id="view-route">
            <div class="section">
                <div class="section-title">sing-box</div>
                <div class="section-body">
                    <div class="row-flex" style="border:none;">
                        <span class="status-dot idle" id="mSbDot"></span>
                        <span id="mSbStatus" style="flex:1;">—</span>
                        <span class="muted" id="mSbVersion"></span>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn btn-ok" style="flex:1;" onclick="sbControl('start')">Start</button>
                        <button class="btn" style="flex:1;" onclick="sbControl('restart')">Restart</button>
                        <button class="btn btn-danger" style="flex:1;" onclick="sbControl('stop')">Stop</button>
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="section-title">Services</div>
                <div class="section-body" id="mSvcList" style="padding:0 12px;"></div>
            </div>
        </div>

        <!-- inbound 视图 -->
        <div class="view" id="view-inbound">
            <div id="mIbList"></div>
        </div>

        <!-- outbound 视图 -->
        <div class="view" id="view-outbound">
            <div id="mObList"></div>
        </div>
    </div>

    <div class="tabbar">
        <div class="tab" data-view="route" onclick="switchView('route')">route</div>
        <div class="tab" data-view="inbound" onclick="switchView('inbound')">inbound</div>
        <div class="tab" data-view="outbound" onclick="switchView('outbound')">outbound</div>
    </div>

    <!-- 通用消息 sheet -->
    <div class="sheet-overlay" id="msgSheet">
        <div class="sheet">
            <div class="sheet-header">Notice<button class="sheet-close" onclick="closeSheet('msgSheet')">&times;</button></div>
            <div class="modal-msg" id="msgText"></div>
            <div class="sheet-footer"><button class="btn btn-primary" onclick="closeSheet('msgSheet')">OK</button></div>
        </div>
    </div>

    <!-- 确认 sheet -->
    <div class="sheet-overlay" id="confirmSheet">
        <div class="sheet">
            <div class="sheet-header" id="confirmTitle">Confirm<button class="sheet-close" onclick="closeSheet('confirmSheet')">&times;</button></div>
            <div class="modal-msg" id="confirmText"></div>
            <div class="sheet-footer">
                <button class="btn" onclick="closeSheet('confirmSheet')">Cancel</button>
                <button class="btn btn-primary" id="confirmOk">OK</button>
            </div>
        </div>
    </div>

    <!-- 切节点 sheet -->
    <div class="sheet-overlay" id="switchSheet">
        <div class="sheet">
            <div class="sheet-header">Switch Node<button class="sheet-close" onclick="closeSheet('switchSheet')">&times;</button></div>
            <div class="sheet-body" id="switchBody"></div>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
</body>
</html>
