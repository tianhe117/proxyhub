{% extends "base.html" %}
{% block title %}ProxyHub — Nodes{% endblock %}

{% block navbar_actions %}
<button class="btn btn-sm" onclick="checkAll()">Check All</button>
<button class="btn btn-sm btn-primary" onclick="openNodeModal()">+ New Node</button>
{% endblock %}

{% block content %}
<div id="nodeGroups"></div>
<div class="empty-state" id="nodesEmpty" style="display:none;">No nodes. Refresh a subscription or add a custom node.</div>
{% endblock %}

{% block modals %}
<!-- 节点编辑模态框 -->
<div class="modal-overlay" id="nodeModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="nodeModalTitle">New Node</span>
            <button class="modal-close" onclick="closeModal('nodeModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Import from URL</label>
                <div style="display:flex;gap:4px;">
                    <input class="input" id="ndImportUrl" placeholder="vmess:// vless:// ss:// trojan:// hy2:// tuic://">
                    <button class="btn" onclick="importUrl()" style="flex-shrink:0;">Parse</button>
                </div>
            </div>
            <div class="field"><label>Name</label><input class="input" id="ndName"></div>
            <div class="field-row">
                <div class="field"><label>Protocol</label>
                    <select class="input" id="ndProtocol" onchange="onNdProtoChange()">
                        <option value="vmess">vmess</option>
                        <option value="vless">vless</option>
                        <option value="trojan">trojan</option>
                        <option value="ss">ss</option>
                        <option value="hysteria2">hysteria2</option>
                        <option value="tuic">tuic</option>
                    </select>
                </div>
                <div class="field"><label>Port</label><input class="input" id="ndPort" type="number"></div>
            </div>
            <div class="field"><label>Address</label><input class="input" id="ndAddress"></div>
            <div id="ndProtoFields"></div>
            <input type="hidden" id="ndEditId">
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('nodeModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveNode()">Save</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/nodes.js') }}"></script>
{% endblock %}
