{% extends "base.html" %}
{% block title %}ProxyHub — Outbounds{% endblock %}

{% block navbar_actions %}
<button class="btn btn-sm btn-primary" onclick="openObModal()">+ New</button>
{% endblock %}

{% block content %}
<div id="obList"></div>
<div class="empty-state" id="obEmpty" style="display:none;">No outbounds. Create one with a node pool.</div>
{% endblock %}

{% block modals %}
<!-- 出站编辑模态框 -->
<div class="modal-overlay" id="obModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="obModalTitle">New Outbound</span>
            <button class="modal-close" onclick="closeModal('obModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Name</label><input class="input" id="obName"></div>
            <div class="field"><label>Nodes (click to add, order = priority)</label>
                <input class="input" id="obNodeFilter" placeholder="Filter nodes..." oninput="renderObNodePicker()" style="margin-bottom:6px;">
                <div id="obNodePicker" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;"></div>
            </div>
            <div class="field"><label>Selected (in order)</label><div id="obSelected" class="muted" style="line-height:1.8;"></div></div>
            <input type="hidden" id="obEditId">
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('obModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveOb()">Save</button>
        </div>
    </div>
</div>

<!-- 池内加节点模态框 -->
<div class="modal-overlay" id="poolAddModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title">Add Node to Pool</span>
            <button class="modal-close" onclick="closeModal('poolAddModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding:8px 20px;">
            <input class="input" id="poolAddFilter" placeholder="Filter nodes..." oninput="renderPoolAddPicker()" style="margin:8px 0;">
            <div id="poolAddPicker" style="max-height:280px;overflow-y:auto;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/outbounds.js') }}"></script>
{% endblock %}
