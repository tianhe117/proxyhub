{% extends "base.html" %}
{% block title %}ProxyHub — Inbounds{% endblock %}

{% block navbar_actions %}
<button class="btn btn-sm btn-primary" onclick="openIbModal()">+ New</button>
{% endblock %}

{% block content %}
<div class="section">
    <div class="section-body" id="ibList"></div>
    <div class="empty-state" id="ibEmpty" style="display:none;">No inbounds. Create one to listen for local proxy clients.</div>
</div>
{% endblock %}

{% block modals %}
<div class="modal-overlay" id="ibModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="ibModalTitle">New Inbound</span>
            <button class="modal-close" onclick="closeModal('ibModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Name</label><input class="input" id="ibName"></div>
            <div class="field-row">
                <div class="field"><label>Protocol</label>
                    <select class="input" id="ibProtocol" onchange="onIbProtoChange()">
                        <option value="http">http</option>
                        <option value="socks">socks</option>
                        <option value="ss">ss</option>
                        <option value="vmess">vmess</option>
                    </select>
                </div>
                <div class="field"><label>Port</label><input class="input" id="ibPort" type="number"></div>
            </div>
            <div class="field"><label>Listen Address</label><input class="input" id="ibListen" value="0.0.0.0"></div>
            <div id="ibParams"></div>
            <input type="hidden" id="ibEditId">
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('ibModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveIb()">Save</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/inbounds.js') }}"></script>
{% endblock %}
